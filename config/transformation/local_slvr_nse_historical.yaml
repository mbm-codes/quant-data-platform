pipeline_version: "v1.0"
process_name: "slvr_historical_nse_load"
run_id: "1"
process_id: "job_slvr_historical_nse_load"

# Logging paths
app_log_file: "./logs/local_job_slvr_nse_historical_app.log"
spark_log_file: "./logs/local_job_slvr_nse_historical_app_spark.log"

input_tables:
  brnz_nse_historical: "local.market_lakehouse.bronze_nse_historical_prices_raw"

output_table: "local.market_lakehouse.slvr_nse_historical_prices_till_29_oct_2023"

load_type: "full"

data_quality:
  column_checks:
    - name: not_null
      columns:
        - trade_date
        - symbol
        - high_price
        - low_price
        - close_price
        - open_price
        - volume_qty
        - dividends
        - stock_splits
      severity: WARN
      enabled: true
      action_on_warn: OBSERVE
      action_on_fail: OBSERVE

    
    - name: value_range
      column: volume_qty
      enabled: true
      action_on_warn: OBSERVE
      action_on_fail: QUARANTINE

      # Range definition
      min: 0
      max: 
      inclusive_min: false
      inclusive_max: true

      # Null & type handling
      allow_null: false
      cast: integer
      strict_type: true

      # Quality tolerance
      mostly: 0.94   # 98% of rows must pass

      # Conditional application
      where: 

      # Severity & messaging
      severity: WARN
      message: "Volume must be a non-negative integer ≤ 1000 for active records"

      # Performance
      sample_percent: 100

      # Metadata
      tags:
        - critical
        - metrics
      owner: data-platform

    - name: ohlc_invariant
      enabled: true
      action_on_warn: QUARANTINE
      action_on_fail: QUARANTINE
      open_col: open_price
      high_col: high_price
      low_col: low_price
      close_col: close_price
      allow_null: false
      mostly: 0.995
      where: 
      severity: FAIL
      tags: ["market-data", "critical"]
      owner: data-platform


  table_checks:
    - name: primary_key_uniqueness
      columns:
        - trade_date
        - symbol
      severity: FAIL
      enabled: true
      action_on_warn: QUARANTINE
      action_on_fail: CLEAN



