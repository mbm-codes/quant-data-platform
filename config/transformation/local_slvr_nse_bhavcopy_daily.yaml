pipeline_version: "v1.0"
process_name: "slvr_nse_bhavcopy_daily"
run_id: "1"
process_id: "job_slvr_nse_bhavcopy_daily"

# Logging paths
app_log_file: "./logs/local_job_slvr_nse_bhavcopy_daily.log"
spark_log_file: "./logs/local_job_slvr_nse_bhavcopy_daily_app_spark.log"

input_tables:
  brnz_nse_bhavcopy_daily: "local.market_lakehouse.bronze_nse_daily_bhavcopy_raw"

output_table: "local.market_lakehouse.slvr_nse_bhavcopy_daily_from_30_oct_2023"

load_type: "full"

data_quality:

  column_checks:
    - name: not_null
      columns:
        - symbol
        - series
        - trade_date
        - prev_close
        - open_price
        - high_price
        - low_price
        - last_price
        - close_price
        - avg_price
        - ttl_trd_qnty
        - turnover_lacs
        - no_of_trades
        - deliv_qty
        - deliv_per

      severity: WARN
      enabled: true
    
    - name: value_range
      column: ttl_trd_qnty
      enabled: true
      # Range definition
      min: 0
      max: 
      inclusive_min: false
      inclusive_max: true

      # Null & type handling
      allow_null: false
      cast: integer
      strict_type: true

      # Quality tolerance
      mostly: 0.98   # 98% of rows must pass

      # Conditional application
      where: 

      # Severity & messaging
      severity: WARN
      message: "Volume must be a non-negative integer ≤ 1000 for active records"

      # Performance
      sample_percent: 100

      # Metadata
      tags:
        - critical
        - metrics
      owner: data-platform

    - name: ohlc_invariant
      enabled: true
      open_col: open_price
      high_col: high_price
      low_col: low_price
      close_col: close_price
      allow_null: false
      mostly: 0.97
      where: 
      severity: WARN
      tags: ["market-data", "critical"]
      owner: data-platform


  table_checks:
    - name: primary_key_uniqueness
      columns:
        - trade_date
        - symbol
        - series
      severity: WARN
      enabled: true

  

