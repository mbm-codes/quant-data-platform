# config/local_historical_load.yaml

pipeline_version: "v1.0"
process_name: "nse_historical_load"
#run_id: "1"
process_id: "job_nse_historical_load"

# Input files (local path)
input_pattern: "/Users/mihirmehta/Desktop/Study/projects/quant-data-platform/data_sources/nse/hist_files/*.csv.gz"

# Output Iceberg table
output_table: "local.market_lakehouse.bronze_nse_historical_prices_raw"

# Static columns added to all rows
static_columns:
  exchange: NSE
  data_src: kaggle_historical

# Column type casting
casts:
  open: ["open_price", "double"]
  high: ["high_price", "double"]
  low: ["low_price", "double"]
  close: ["close_price", "double"]
  volume: ["volume_qty", "bigint"]

schema:
  raw:
    strict: true
  output:
    strict: true


# Logging paths
app_log_file: "./logs/local_job_nse_historical_load_app.log"
spark_log_file: "./logs/local_job_nse_historical_load_spark.log"

load_type: "full"


data_quality:
  file_checks:
    - name: file_exists
      enabled: true
      severity: FAIL
      action: BLOCK

    - name: non_empty_file
      enabled: true
      min_rows: 1
      severity: FAIL
      action: BLOCK


  column_checks:
    - name: not_null
      columns:
        - date
        - open
        - high
        - low
        - close
        - volume
        - dividends
        - stock_splits
      severity: WARN
      enabled: true
      action: QUARANTINE
    
    - name: value_range
      column: volume
      enabled: true
      action: OBSERVE
      # Range definition
      min: 0
      max: 
      inclusive_min: false
      inclusive_max: true

      # Null & type handling
      allow_null: false
      cast: integer
      strict_type: true

      # Quality tolerance
      mostly: 0.98   # 98% of rows must pass

      # Conditional application
      where: 

      # Severity & messaging
      severity: WARN
      message: "Volume must be a non-negative integer ≤ 1000 for active records"

      # Performance
      sample_percent: 100

      # Metadata
      tags:
        - critical
        - metrics
      owner: data-platform

    - name: ohlc_invariant
      enabled: true
      action: OBSERVE
      open_col: open
      high_col: high
      low_col: low
      close_col: close
      allow_null: false
      mostly: 0.995
      where: 
      severity: WARN
      tags: ["market-data", "critical"]
      owner: data-platform


  table_checks:
    - name: primary_key_uniqueness
      columns:
        - trade_date
        - symbol
      severity: WARN
      enabled: true
      action: CLEAN

    # - name: row_count_drift
    #   compare_with: previous_day
    #   max_drop_pct: 20
    #   severity: WARN
