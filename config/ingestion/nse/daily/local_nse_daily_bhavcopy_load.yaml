
pipeline_version: "v1.0"
process_name: "nse_daily_bhavcopy_load"
run_id: "1"
process_id: "job_nse_daily_bhavcopy_load"

# Logging paths
app_log_file: "./logs/local_job_nse_daily_bhavcopy_load_app.log"
spark_log_file: "./logs/local_job_nse_daily_bhavcopy_load_spark.log"

# Input files (local path)
input_pattern: "/Users/mihirmehta/Desktop/Study/projects/quant-data-platform/data_sources/nse/nse_bhavcopy_from_nov_2023/*.csv.gz"

# Output Iceberg table
output_table: "local.market_lakehouse.bronze_nse_daily_bhavcopy_raw"

# Column type casting
casts:
  date1: ["trade_date", "date"]
  prev_close: ["prev_close", "double"]
  open_price: ["open_price", "double"]
  high_price: ["high_price", "double"]
  low_price: ["low_price", "double"]
  last_price: ["last_price", "double"]
  close_price: ["close_price", "double"]
  avg_price: ["avg_price", "double"]
  ttl_trd_qnty: ["ttl_trd_qnty", "bigint"]
  turnover_lacs: ["turnover_lacs", "double"]
  no_of_trades: ["no_of_trades", "bigint"]
  deliv_qty: ["deliv_qty", "bigint"]
  deliv_per: ["deliv_per", "double"]

schema:
  raw:
    strict: true
  output:
    strict: true

# Static columns added to all rows
static_columns:
  exchange: NSE
  data_src: nse_bhavcopy

load_type: "full"

data_quality:

  file_checks:
    - name: file_exists
      enabled: true
      severity: FAIL
      action: BLOCK

    - name: non_empty_file
      enabled: true
      min_rows: 1
      severity: FAIL
      action: BLOCK

  column_checks:
    - name: not_null
      columns:
        - symbol
        - series
        - date1
        - prev_close
        - open_price
        - high_price
        - low_price
        - close_price
        - avg_price
        - ttl_trd_qnty
        - turnover_lacs
        - no_of_trades
        - deliv_qty
        - deliv_per

      severity: WARN
      enabled: true
      action: QUARANTINE
    
    - name: value_range
      column: ttl_trd_qnty
      enabled: true
      action: QUARANTINE
      # Range definition
      min: 0
      max: 
      inclusive_min: false
      inclusive_max: true

      # Null & type handling
      allow_null: false
      cast: integer
      strict_type: true

      # Quality tolerance
      mostly: 0.98   # 98% of rows must pass

      # Conditional application
      where: 

      # Severity & messaging
      severity: WARN
      message: "Volume must be a non-negative integer ≤ 1000 for active records"

      # Performance
      sample_percent: 100

      # Metadata
      tags:
        - critical
        - metrics
      owner: data-platform

    - name: ohlc_invariant
      enabled: true
      action: OBSERVE
      open_col: open_price
      high_col: high_price
      low_col: low_price
      close_col: close_price
      allow_null: false
      mostly: 0.97
      where: 
      severity: WARN
      tags: ["market-data", "critical"]
      owner: data-platform


  table_checks:
    - name: primary_key_uniqueness
      columns:
        - trade_date
        - symbol
      severity: WARN
      enabled: true
      action: CLEAN
